# Set the value below to your public IP address or domain.
external-ip=localhost

listening-port=3478

# Time-limited HMAC credentials (TURN REST). The secret is passed at
# container start via --static-auth-secret and must match TURN_AUTH_SECRET
# on the rendezvous service.
use-auth-secret
realm=screensy
fingerprint
stale-nonce=600
no-cli
no-tls
no-dtls
no-multicast-peers
no-loopback-peers

# Block relay to local/private/metadata addresses.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=::1
