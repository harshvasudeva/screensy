name: ci

on:
    push:
    pull_request:

jobs:
    rendezvous:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: screensy-rendezvous
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
                  cache: npm
                  cache-dependency-path: screensy-rendezvous/package-lock.json
            - run: npm ci
            - run: npm test
            - run: npm audit --omit=dev

    website:
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: screensy-website
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-go@v5
              with:
                  go-version: "1.27.1"
            - uses: actions/setup-node@v4
              with:
                  node-version: "24"
            - run: go test ./...
            - run: go vet ./...
            - run: npx --yes typescript@7.0.2 tsc -p tsconfig.json --noEmit
